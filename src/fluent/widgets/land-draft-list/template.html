<div class="rn-panel">
    <div class="rn-panel__header">
        <h2 class="rn-panel__title">My project drafts</h2>
        <button type="button" class="rn-panel__refresh" ng-click="c.refresh()" ng-disabled="c.refreshing"
            title="Refresh list" aria-label="Refresh list">
            <i class="fa fa-refresh" ng-class="{'fa-spin': c.refreshing}"></i>
        </button>
    </div>

    <div class="rn-panel__body">
        <div class="rn-empty" ng-if="!c.data.drafts.length">
            <p class="rn-empty__title">No drafts yet</p>
            <p class="rn-empty__text">Projects you save or submit will be listed here.</p>
        </div>

        <ul class="rn-list" ng-if="c.data.drafts.length">
            <li class="rn-list__item" ng-repeat="draft in c.data.drafts track by draft.sysId">
                <div class="rn-list__head">
                    <span class="rn-list__name">{{draft.projectName}}</span>
                    <span class="rn-badge rn-badge--{{draft.state}}">{{draft.stateLabel}}</span>
                </div>
                <p class="rn-list__meta">
                    <span ng-if="draft.energyType">{{draft.energyType}}</span>
                    <span ng-if="draft.municipality"> · {{draft.municipality}}<span ng-if="draft.region">, {{draft.region}}</span></span>
                </p>
                <p class="rn-list__figures">
                    <span ng-if="draft.capacity">{{draft.capacity}} MW</span>
                    <span ng-if="draft.area"> · {{draft.area}} ha</span>
                    <span class="rn-list__date"> · {{draft.created}}</span>
                </p>
            </li>
        </ul>
    </div>
</div>
